name: Deploy docs

# Builds the MkDocs site and publishes it to GitHub Pages.
#
# One-time repo setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". The configure-pages step below also attempts this via the
# API on first run (enablement: true), but setting it in the UI is the reliable
# path if that call is not permitted for the repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write a Pages deployment, and mint the OIDC
# token that deploy-pages exchanges for its upload credentials.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. cancel-in-progress stays false so an in-flight
# publish is never killed half-way; queued runs just wait their turn.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv and restore its cache
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.11"

      - name: Install dependencies from the lockfile
        # --frozen fails the build if uv.lock is out of date with pyproject.toml,
        # so CI can never silently resolve a different dependency set.
        run: uv sync --frozen

      - name: Resolve the Pages URL
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build the site
        # SITE_URL feeds mkdocs.yml's `site_url: !ENV [SITE_URL, ...]`. It has to
        # be the real published URL: Material needs it for instant navigation and
        # for absolute links in sitemap.xml. base_url has no trailing slash.
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        # --strict turns MkDocs warnings into errors, so a broken internal link
        # or a page missing from the nav fails the build instead of shipping.
        run: uv run mkdocs build --strict

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
