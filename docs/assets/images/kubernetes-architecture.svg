<?xml version="1.0" encoding="UTF-8"?>
<svg  width="940" height="650" viewBox="0 0 940 650" role="img" aria-labelledby="k8s-title k8s-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="k8s-title">Kubernetes cluster architecture</title>
  <desc id="k8s-desc">An Admin UI and a CLI talk to the Control Plane. The Control Plane contains the Controller Manager, Scheduler and etcd, which all feed the API Server. The API Server drives two Worker Nodes. Each Worker Node runs two Pods containing containers, plus a container runtime, a kubelet and a kube-proxy.</desc>
